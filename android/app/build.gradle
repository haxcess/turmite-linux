plugins { id 'com.android.application' }

android {
    namespace 'org.haxcess.turmite'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        applicationId 'org.haxcess.turmite'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=none' }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'none' }
            externalNativeBuild {
                cmake { arguments '-DCMAKE_BUILD_TYPE=Release' }
            }
        }
    }
}

// Omit Java source/line/local-variable debug metadata before R8 processing.
tasks.withType(JavaCompile).configureEach {
    if (name == 'compileReleaseJavaWithJavac') {
        options.debug = false
    }
}

// Inspect the packaged artifact, not just the intermediate native libraries.
tasks.register('verifyReleaseApk') {
    dependsOn 'assembleRelease'
    doLast {
        exec {
            commandLine 'sh', rootProject.file('verify-release.sh'),
                layout.buildDirectory.file('outputs/apk/release/app-release-unsigned.apk').get().asFile,
                android.ndkDirectory, android.sdkDirectory
        }
    }
}
